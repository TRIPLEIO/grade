<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Grade Advisor — Clean White Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFFFFF;
      color: #111827;
      display: flex;
      min-height: 100vh;
      flex-direction: row;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
    }
    aside {
      width: 265px;
      border-right: 1px solid #E5E7EB;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      aside { width: 100%; border-right: none; border-bottom: 1px solid #E5E7EB; }
    }
    .brand { padding: 24px; border-bottom: 1px solid #E5E7EB; }
    .brand h1 { font-size: 18px; font-weight: 700; color: #111827; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; color: #6B7280; margin-top: 4px; }
    nav { padding: 12px; }
    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 4px;
      font-size: 13.5px;
      color: #374151;
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      transition: 0.15s;
    }
    .nav-btn:hover { background-color: #F9FAFB; }
    .nav-btn.active {
      background-color: #F3F4F6;
      font-weight: 600;
      color: #111827;
      border-left: 3px solid #111827;
    }
    .sidebar-footer { padding: 16px; border-top: 1px solid #E5E7EB; }
    .btn-outline {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-outline:hover { background: #F3F4F6; }
    .btn-dark {
      width: 100%;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #111827;
      background: #FFFFFF;
      border: 1px solid #111827;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
      transition: 0.15s;
    }
    .btn-dark:hover { background: #111827; color: #FFFFFF; }

    main { flex: 1; padding: 32px 40px; background: #FFFFFF; overflow-y: auto; }
    @media (max-width: 768px) { main { padding: 20px; } }
    .hidden { display: none !important; }
    .page-header {
      border-bottom: 1px solid #E5E7EB;
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header h2 { font-size: 22px; font-weight: 700; color: #111827; }
    .page-header p { font-size: 13px; color: #6B7280; margin-top: 4px; }
    select, input[type="text"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 13px;
      background: #FFFFFF;
      color: #111827;
    }
    select:focus, input:focus { outline: none; border-color: #111827; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .grid-calc { display: grid; grid-template-columns: 1.65fr 1fr; gap: 24px; }
    @media (max-width: 960px) { .grid-calc { grid-template-columns: 1fr; } }

    .card {
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 20px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-label { font-size: 12px; color: #6B7280; }
    .kpi-val { font-size: 24px; font-weight: 700; margin-top: 6px; color: #111827; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #D1D5DB;
    }
    .badge-safe { background: #ECFDF5; color: #065F46; border-color: #A7F3D0; }
    .badge-ok { background: #EFF6FF; color: #1E40AF; border-color: #BFDBFE; }
    .badge-warn { background: #FFFBEB; color: #92400E; border-color: #FDE68A; }
    .badge-danger { background: #FFF1F2; color: #9F1239; border-color: #FECDD3; }
    .badge-neutral { background: #F9FAFB; color: #4B5563; border-color: #E5E7EB; }

    .comp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #F3F4F6;
      gap: 12px;
      flex-wrap: wrap;
    }
    .comp-row:last-child { border-bottom: none; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 14px; border-bottom: 1px solid #E5E7EB; text-align: left; }
    th { background: #F9FAFB; font-weight: 600; }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">
        <h1>GradeAdvisor.</h1>
        <p>Sistem Evaluasi & Target IPK 8 Smt</p>
      </div>
      <nav>
        <button onclick="switchTab('beranda')" id="tab-beranda" class="nav-btn active">1. Beranda</button>
        <button onclick="switchTab('hitung')" id="tab-hitung" class="nav-btn">2. Hitung Nilai MK</button>
        <button onclick="switchTab('ipk8')" id="tab-ipk8" class="nav-btn">3. Target IPK 8 Semester</button>
        <button onclick="switchTab('simulasi')" id="tab-simulasi" class="nav-btn">4. Simulasi What-If</button>
        <button onclick="switchTab('bobot')" id="tab-bobot" class="nav-btn">5. Manajemen Bobot MK</button>
        <button onclick="switchTab('skala')" id="tab-skala" class="nav-btn">6. Skala Nilai & Analitik</button>
      </nav>
    </div>
    <div class="sidebar-footer">
      <button onclick="resetAllData()" class="btn-outline">Reset Semua Data</button>
    </div>
  </aside>

  <main>

            <option value="80">A- (Min. 80 / IP 3.70)</option>
